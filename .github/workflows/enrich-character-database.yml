name: Incremental Marvel character enrichment

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marvel-character-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out archive
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate enrichment script
        run: python -m py_compile scripts/enrich_character_database.py
      - name: Import next character batch
        run: python scripts/enrich_character_database.py
        env:
          ENRICH_BATCH_SIZE: "200"
      - name: Commit enriched profiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-data/character-enrichment site-data/character-enrichment-progress.json
          if git diff --cached --quiet; then
            echo "No new enrichment records."
          else
            git commit -m "Enrich next batch of Marvel character profiles"
            git push
          fi
