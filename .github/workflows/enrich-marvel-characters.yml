name: Enrich Marvel character database

on:
  push:
    branches:
      - main
    paths:
      - scripts/enrich_marvel_characters.py
      - .github/workflows/enrich-marvel-characters.yml
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marvel-character-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out archive
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install importer dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Import next character batch
        run: python scripts/enrich_marvel_characters.py --batch-size 1000

      - name: Commit imported profile data
        run: |
          git add site-data/character-enrichment
          if git diff --cached --quiet; then
            echo "No new character data was generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Populate next Marvel character profile batch"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Another enrichment run advanced the same batch; upstream progress is preserved."
              exit 0
            fi
          done
          echo "Could not push after three retries."
          exit 1
