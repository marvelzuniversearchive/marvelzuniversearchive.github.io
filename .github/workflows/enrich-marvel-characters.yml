name: Enrich Marvel character database

on:
  push:
    branches:
      - main
    paths:
      - scripts/enrich_marvel_characters.py
      - .github/workflows/enrich-marvel-characters.yml
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marvel-character-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out archive
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install importer dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Validate inline JavaScript before publishing
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          source = Path("site-data/part-017.txt").read_text(encoding="utf-8")
          scripts = [s for s in re.findall(r"<script\\b[^>]*>([\\s\\S]*?)</script>", source, re.I) if s.strip()]
          if not scripts:
              raise SystemExit("No inline JavaScript blocks found")
          Path("/tmp/mua-main.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/mua-main.js

      - name: Process the entire remaining character index
        run: |
          set -euo pipefail
          batch_count=0
          while true; do
            NEXT=$(python -c 'import json,pathlib; p=pathlib.Path("site-data/character-enrichment/progress.json"); d=json.loads(p.read_text()) if p.exists() else {}; print(int(d.get("next_index",0)))')
            TOTAL=$(python -c 'import json,pathlib; p=pathlib.Path("site-data/character-enrichment/progress.json"); d=json.loads(p.read_text()) if p.exists() else {}; print(int(d.get("total",0)))')
            if [ "$TOTAL" -gt 0 ] && [ "$NEXT" -ge "$TOTAL" ]; then break; fi
            python scripts/enrich_marvel_characters.py --batch-size 1000
            batch_count=$((batch_count+1))
            if [ "$batch_count" -ge 5 ]; then
              git add site-data/character-enrichment
              if ! git diff --cached --quiet; then
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git commit -m "Populate Marvel character research batches"
                for attempt in 1 2 3 4 5; do
                  if git push origin HEAD:main; then
                    break
                  fi
                  git fetch origin main
                  git rebase origin/main
                  if [ "$attempt" -eq 5 ]; then
                    echo "Push failed after five rebase attempts."
                    exit 1
                  fi
                  sleep $((attempt * 2))
                done
              fi
              batch_count=0
            fi
          done
          git add site-data/character-enrichment
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Complete Marvel character index enrichment pass"
            git push origin HEAD:main
          fi
          python -c 'import json,pathlib; d=json.loads(pathlib.Path("site-data/character-enrichment/progress.json").read_text()); assert d.get("completed") and d.get("next_index")==d.get("total"), d; print("All indexed character names attempted:",d["total"])'
