name: Enrich Marvel character database

on:
  push:
    branches:
      - main
    paths:
      - scripts/enrich_marvel_characters.py
      - .github/workflows/enrich-marvel-characters.yml
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: marvel-character-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out archive
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install importer dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Import next character batch
        run: python scripts/enrich_marvel_characters.py --batch-size 1000

      - name: Commit imported profile data
        run: |
          if git diff --quiet -- site-data/character-enrichment; then
            echo "No new character data was generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-data/character-enrichment
          git commit -m "Populate next Marvel character profile batch"
          git push
