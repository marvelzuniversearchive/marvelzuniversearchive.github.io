<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KOHAN CITY</title>
<style>

*{box-sizing:border-box}
:root{--LW:3250px;--LH:1800px}
html,body{margin:0;padding:0;background:#b9c9f6;overflow-x:hidden}
#stage{position:fixed;left:0;right:0;top:-80px;height:calc(100vh + 160px);
  overflow:hidden;z-index:0;transform:translate3d(0,var(--drift,0px),0);will-change:transform}
.layer{position:absolute;left:0;top:0;width:100%;height:var(--LH);
  background-repeat:repeat-x;background-position:0 0;background-size:var(--LW) var(--LH);
  transform:translate3d(0,0,0);will-change:background-position,transform}
#l1{z-index:1}#l3{z-index:2}#l2{z-index:3}#l4{display:none}
#scroll{position:relative;z-index:5;height:7600px;pointer-events:none}
#glitch-panel{position:fixed;z-index:50;left:0;top:0;width:190px;height:112px;opacity:0;
  pointer-events:none;mix-blend-mode:screen;backdrop-filter:saturate(1.8) hue-rotate(38deg) contrast(1.12);
  -webkit-backdrop-filter:saturate(1.8) hue-rotate(38deg) contrast(1.12);
  clip-path:polygon(4% 0,100% 7%,94% 100%,0 88%);
  border:1px solid rgba(155,239,255,.78);
  background:repeating-linear-gradient(0deg,rgba(93,226,255,.18) 0 2px,transparent 2px 7px),
    linear-gradient(112deg,rgba(255,89,191,.22),rgba(94,232,255,.12) 48%,rgba(153,111,255,.2));
  box-shadow:0 0 18px rgba(89,218,255,.22),inset 0 0 14px rgba(255,111,211,.2);
  transform:translate3d(0,0,0);will-change:transform,opacity}
#glitch-panel::before,#glitch-panel::after{content:"";position:absolute;inset:0;pointer-events:none}
#glitch-panel::before{background:linear-gradient(90deg,transparent 0 18%,rgba(255,90,190,.5) 18% 20%,transparent 20% 72%,rgba(96,229,255,.48) 72% 75%,transparent 75%);
  transform:translateX(5px);opacity:.75}
#glitch-panel::after{inset:32% -8% 38% 8%;background:rgba(116,226,255,.32);transform:translateX(-9px);}
#glitch-panel.active{opacity:1;animation:panelGlitch 145ms steps(2,end) both}
@keyframes panelGlitch{0%{filter:hue-rotate(0deg);transform:translate3d(0,0,0) skewX(0)}35%{filter:hue-rotate(75deg);transform:translate3d(5px,-2px,0) skewX(-3deg)}70%{filter:hue-rotate(-45deg);transform:translate3d(-3px,2px,0) skewX(2deg)}100%{filter:hue-rotate(0deg);transform:translate3d(0,0,0) skewX(0)}}
@media(prefers-reduced-motion:reduce){#glitch-panel{display:none}}

/* ---- v6: DOM city (columns) ---- */
:root{--s:1}
#l1{z-index:1}#l3{z-index:2}
#city{position:absolute;left:0;top:0;width:calc(var(--LW)*2);height:var(--LH);z-index:3;will-change:transform;transform:translate3d(0,0,0)}
.col{position:absolute;bottom:0}
.col .wall{position:absolute;inset:0;border-left:calc(var(--s)*3px) solid var(--ink);border-right:calc(var(--s)*3px) solid var(--ink);border-top:calc(var(--s)*3px) solid var(--ink);
  box-shadow:calc(var(--s)*-1.5px) 0 0 rgba(0,235,255,.28),calc(var(--s)*1.5px) 0 0 rgba(255,40,190,.28)}
.col .tiles{position:absolute;left:0;right:0;top:calc(var(--s)*4px);bottom:calc(var(--s)*30px);background-repeat:repeat}
.col .shade{position:absolute;left:0;right:0;bottom:calc(var(--s)*30px);height:42%;pointer-events:none;
  background-image:radial-gradient(circle,var(--side) 1.5px,transparent 2.2px);background-size:calc(var(--s)*6px) calc(var(--s)*6px);opacity:.6}
.col .side{position:absolute;top:0;bottom:0;right:0;width:calc(var(--s)*10px);background:var(--side)}
.col .base{position:absolute;left:0;right:0;bottom:0;height:calc(var(--s)*30px);background:var(--side);border-top:calc(var(--s)*2px) solid var(--ink)}
.col .base.shop{background:linear-gradient(180deg,#ffd88a,#ffe9b0 60%,#ffd88a)}
.col .awn{position:absolute;left:0;right:0;bottom:calc(var(--s)*30px);height:calc(var(--s)*10px);
  background:repeating-linear-gradient(90deg,var(--glass) 0 calc(var(--s)*12px),var(--top) calc(var(--s)*12px) calc(var(--s)*24px))}
.col .cap{position:absolute;left:0;right:0;bottom:100%;height:calc(var(--s)*80px);pointer-events:none;overflow:visible}
.col .cap svg{position:absolute;left:0;bottom:0;width:100%;height:100%;overflow:visible}
.lat{position:absolute;bottom:0;width:calc(var(--s)*84px);transform:translateX(-50%)}
.lat svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.sky{position:absolute;height:calc(var(--s)*18px);border:calc(var(--s)*2px) solid var(--ink);
  background:repeating-linear-gradient(90deg,var(--glass) 0 calc(var(--s)*8px),var(--lit) calc(var(--s)*8px) calc(var(--s)*14px))}
.pool{position:absolute;width:calc(var(--s)*92px);height:calc(var(--s)*22px);border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(ellipse at 35% 35%,#7d66c8 0,#0d0b1c 45%,#0d0b1c 100%)}
.hammer{position:absolute;width:calc(var(--s)*140px);height:calc(var(--s)*60px);transform:translate(-50%,-100%);pointer-events:none}
.hammer svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#threads{position:absolute;left:0;top:0;width:calc(var(--LW)*2);height:var(--LH);pointer-events:none;z-index:4;overflow:visible}

function crownSvg(type, c){
  if (type === 'spire')   return "<svg viewBox='0 0 100 80' preserveAspectRatio='xMidYMax meet'><polygon points='46,80 54,80 52,8 48,8' fill='" + c.ink + "'/><rect x='49' y='0' width='2' height='10' fill='" + c.ink + "'/><circle cx='50' cy='4' r='3' fill='" + c.glass + "'/></svg>";
  if (type === 'antenna') return "<svg viewBox='0 0 100 80' preserveAspectRatio='xMidYMax meet'><rect x='49' y='18' width='2.5' height='62' fill='" + c.ink + "'/><rect x='32' y='50' width='36' height='2.5' fill='" + c.ink + "'/></svg>";
  if (type === 'tank')    return "<svg viewBox='0 0 100 80' preserveAspectRatio='xMidYMax meet'><polygon points='30,60 70,60 50,32' fill='" + c.side + "' stroke='" + c.ink + "' stroke-width='2'/><rect x='36' y='60' width='28' height='18' fill='" + c.top + "' stroke='" + c.ink + "' stroke-width='2'/></svg>";
  if (type === 'helipad') return "<svg viewBox='0 0 100 80' preserveAspectRatio='xMidYMax meet'><ellipse cx='50' cy='76' rx='30' ry='6' fill='" + c.top + "' stroke='" + c.ink + "' stroke-width='2'/></svg>";
  return '';
}

/* ---------- build the city once from the composition data ---------- */
function buildCity(){
  for (const c of COLS){
    const col = document.createElement('div');
    col.className = 'col';
    col.style.left = c.x + '%';
    col.style.width = c.w + '%';
    col.style.top = c.t + '%';
    col.style.zIndex = c.k === 'b' ? 1 : c.k === 'm' ? 2 : 3;
    const vars = {'--lit': c.lit, '--side': c.side, '--top': c.top, '--glass': c.glass, '--ink': c.ink, '--dark': c.dark};
    for (const k in vars) col.style.setProperty(k, vars[k]);
    const wall = document.createElement('div'); wall.className = 'wall';
    wall.style.background = c.lit;
    const tiles = document.createElement('div'); tiles.className = 'tiles';
    tiles.style.backgroundImage = tileFor(c);
    tiles.style.backgroundSize = 'calc(var(--s)*32px) calc(var(--s)*48px)';
    tiles.style.backgroundPosition = ((c.seed % 32) * -1) + 'px ' + ((c.seed % 48) * -1) + 'px';
    const shade = document.createElement('div'); shade.className = 'shade';
    const side = document.createElement('div'); side.className = 'side';
    side.style.background = c.side;
    const base = document.createElement('div'); base.className = 'base' + (c.shop ? ' shop' : '');
    if (!c.shop) base.style.background = c.side;
    col.append(wall, tiles, shade, side, base);
    if (c.shop){
      const awn = document.createElement('div'); awn.className = 'awn';
      awn.style.setProperty('--glass', c.glass); awn.style.setProperty('--top', c.top);
      col.append(awn);
    }
    if (c.crown && c.crown !== 'none'){
      const cap = document.createElement('div'); cap.className = 'cap';
      cap.innerHTML = crownSvg(c.crown, c);
      col.append(cap);
    }
    city.append(col);
  }
  for (const s of SKYWAYS){
    const d = document.createElement('div'); d.className = 'sky';
    d.style.left = s.x + '%'; d.style.width = s.w + '%'; d.style.top = s.t + '%';
    d.style.setProperty('--lit', s.lit); d.style.setProperty('--glass', s.glass); d.style.setProperty('--ink', s.ink);
    city.append(d);
  }
  for (const t of LATTICE){
    const d = document.createElement('div'); d.className = 'lat';
    d.style.left = t.x + '%'; d.style.top = t.t + '%';
    d.innerHTML = "<svg viewBox='0 0 84 100' preserveAspectRatio='none'>" +
      "<path d='M22,100 L38,0 M62,100 L46,0' stroke='#2a1d66' stroke-width='3' fill='none' vector-effect='non-scaling-stroke'/>" +
      "<path d='M26,70 L58,70 M31,45 L53,45 M36,22 L48,22' stroke='#2a1d66' stroke-width='2' fill='none' vector-effect='non-scaling-stroke'/>" +
      "<path d='M22,100 L58,70 M62,100 L42,70 M31,70 L53,45 M53,70 L31,45' stroke='#2a1d66' stroke-width='1.5' fill='none' vector-effect='non-scaling-stroke'/>" +
      "</svg>";
    city.append(d);
  }
  for (const p of POOLS){
    const d = document.createElement('div'); d.className = 'pool';
    d.style.left = p.x + '%'; d.style.top = p.t + '%';
    city.append(d);
  }
  if (HAMMER){
    const h = document.createElement('div'); h.className = 'hammer';
    h.style.left = HAMMER.x + '%'; h.style.top = HAMMER.t + '%';
    h.innerHTML = "<svg viewBox='0 0 140 60' preserveAspectRatio='xMidYMax meet'>" +
      "<rect x='10' y='30' width='72' height='28' fill='#9fb4d6' stroke='#1b1f3a' stroke-width='2'/>" +
      "<rect x='10' y='30' width='72' height='5' fill='#e8f2ff'/>" +
      "<rect x='82' y='46' width='46' height='12' fill='#3a2e4f' stroke='#1b1f3a' stroke-width='2'/>" +
      "<rect x='110' y='46' width='18' height='12' fill='#231b36'/>" +
      "<circle cx='12' cy='30' r='3' fill='#f2fbff'/></svg>";
    city.append(h);
  }
  const NS = 'http://www.w3.org/2000/svg';
  for (const [x1, y1, x2, y2] of THREADS){
    const p = document.createElementNS(NS, 'path');
    const mx = (x1 + x2) / 2, my = Math.min(y1, y2) + 70 * 0.9;
    p.setAttribute('d', 'M' + x1 + ',' + y1 + ' Q' + mx + ',' + my + ' ' + x2 + ',' + y2);
    p.setAttribute('stroke', '#f2f6ff');
    p.setAttribute('stroke-opacity', '.6');
    p.setAttribute('stroke-width', '2.2');
    p.setAttribute('fill', 'none');
    p.setAttribute('vector-effect', 'non-scaling-stroke');
    threadsSvg.append(p);
  }
}

/* ---------- layout: sizes follow the real stage, observed continuously ---------- */
function layout(){
  const vh = window.innerHeight;
  LH = Math.max(1800, vh + 700);
  LW = LH * (SRC.w / SRC.h);
  scale = LH / 1800;
  maxTravel = Math.max(1, LH - vh - 100);
  const root = document.documentElement.style;
  root.setProperty('--LH', LH + 'px');
  root.setProperty('--LW', LW + 'px');
  root.setProperty('--s', scale.toFixed(5));
}
if (window.ResizeObserver){
  new ResizeObserver(() => { layout(); applyVertical(); }).observe(stage);
}

/* ---------- horizontal clock (system A) and vertical camera (system B) ---------- */
let last = performance.now();
function tickHorizontal(now){
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!reduceMotion){
    for (const k of [1, 3, 2]){
      offset[k] = (offset[k] + CFG.hSpeed[k] * scale * dt) % LW;
    }
    el[1].style.backgroundPositionX = (-offset[1]).toFixed(2) + 'px';
    el[3].style.backgroundPositionX = (-offset[3]).toFixed(2) + 'px';
    city.style.transform = 'translate3d(' + (-offset[2]).toFixed(2) + 'px,' + (-camY).toFixed(2) + 'px,0)';
  }
  stepVertical();
  requestAnimationFrame(tickHorizontal);
}

let camTarget = 0, camCur = 0;
function scrollProgress(){
  const max = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
  return Math.min(1, Math.max(0, window.scrollY / max));
}
function writeVertical(progress){
  camY = progress * maxTravel;
  el[1].style.transform = 'translate3d(0,' + (-camY).toFixed(2) + 'px,0)';
  el[3].style.transform = 'translate3d(0,' + (-camY).toFixed(2) + 'px,0)';
  city.style.transform = 'translate3d(' + (-offset[2]).toFixed(2) + 'px,' + (-camY).toFixed(2) + 'px,0)';
  const drift = reduceMotion ? 0 : progress * CFG.driftMax;
  stage.style.setProperty('--drift', drift.toFixed(2) + 'px');
}
function stepVertical(){
  const d = camTarget - camCur;
  if (Math.abs(d) < 0.00001) return;
  camCur += d * (reduceMotion ? 1 : 0.2);
  if (Math.abs(camTarget - camCur) < 0.00001) camCur = camTarget;
  writeVertical(camCur);
}
function applyVertical(){
  camTarget = camCur = scrollProgress();
  writeVertical(camCur);
}
window.addEventListener('scroll', () => { camTarget = scrollProgress(); }, {passive: true});
window.addEventListener('resize', () => { layout(); applyVertical(); });

/* ---------- glitch: one small quadrilateral, briefly, at random intervals ---------- */
let glitchTimer = 0;
function scheduleGlitch(){
  if (reduceMotion || document.hidden || !glitchPanel) return;
  const delay = 7600 + Math.random() * 7200;
  glitchTimer = window.setTimeout(() => {
    if (document.hidden) { scheduleGlitch(); return; }
    const vw = Math.max(1, window.innerWidth), vh = Math.max(1, window.innerHeight);
    const width = Math.min(vw * (0.18 + Math.random() * 0.13), 290);
    const height = Math.min(vh * (0.09 + Math.random() * 0.08), 150);
    const left = Math.max(0, Math.random() * (vw - width));
    const top = Math.max(0, Math.random() * (vh - height));
    glitchPanel.style.width = width.toFixed(0) + 'px';
    glitchPanel.style.height = height.toFixed(0) + 'px';
    glitchPanel.style.left = left.toFixed(0) + 'px';
    glitchPanel.style.top = top.toFixed(0) + 'px';
    glitchPanel.style.clipPath = Math.random() > .5
      ? 'polygon(5% 0,100% 9%,91% 100%,0 87%)'
      : 'polygon(13% 0,100% 0,86% 100%,0 78%)';
    glitchPanel.classList.remove('active');
    void glitchPanel.offsetWidth;
    glitchPanel.classList.add('active');
    window.setTimeout(() => glitchPanel.classList.remove('active'), 190);
    scheduleGlitch();
  }, delay);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { window.clearTimeout(glitchTimer); glitchPanel?.classList.remove('active'); }
  else scheduleGlitch();
});

layout();
buildCity();
applyVertical();
requestAnimationFrame(tickHorizontal);
scheduleGlitch();
</script>
